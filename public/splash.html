<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Proto X-24</title>

    <!-- Bootstrap local -->
    <link rel="stylesheet" href="css/bootstrap.css">

    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        body {
            background:
                radial-gradient(circle at center,
                    #202020 0%,
                    #111111 45%,
                    #080808 100%);

            color: #ffffff;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;
        }

        .splash-container {
            width: 100%;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            position: relative;
        }

        /*
        |--------------------------------------------------------------------------
        | Halo lumineux derrière le logo
        |--------------------------------------------------------------------------
        */

        .logo-wrapper {
            position: relative;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-wrapper::before {
            content: "";

            position: absolute;

            width: 230px;
            height: 230px;

            border-radius: 50%;

            background: rgba(255, 193, 7, 0.10);

            filter: blur(45px);
        }

        .company-logo {
            position: relative;

            width: 230px;
            max-width: 70vw;

            height: auto;

            object-fit: contain;

            border-radius: 10px;

            box-shadow:
                0 0 35px rgba(255, 193, 7, 0.12);
        }

        /*
        |--------------------------------------------------------------------------
        | Nom de l'application
        |--------------------------------------------------------------------------
        */

        .app-name {
            margin-top: 28px;

            font-size: 1.45rem;
            font-weight: 600;

            letter-spacing: 0.12em;

            text-transform: uppercase;
        }

        .app-subtitle {
            margin-top: 6px;

            font-size: 0.75rem;

            letter-spacing: 0.18em;

            text-transform: uppercase;

            color: rgba(255, 255, 255, 0.55);
        }

        /*
        |--------------------------------------------------------------------------
        | Zone chargement
        |--------------------------------------------------------------------------
        */

        .loading-area {
            margin-top: 32px;

            width: 220px;
        }

        .loading-text {
            font-size: 0.75rem;

            color: rgba(255, 255, 255, 0.55);

            letter-spacing: 0.08em;
        }

        /*
        |--------------------------------------------------------------------------
        | Spinner
        |--------------------------------------------------------------------------
        */

        .loading-spinner {
            width: 18px;
            height: 18px;

            border: 2px solid rgba(255, 255, 255, 0.15);
            border-top-color: #ffc107;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /*
        |--------------------------------------------------------------------------
        | Barre de chargement décorative
        |--------------------------------------------------------------------------
        */

        .loading-bar {
            width: 100%;
            height: 3px;

            margin-top: 14px;

            overflow: hidden;

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.08);
        }

        .loading-bar-progress {
            width: 35%;
            height: 100%;

            border-radius: 10px;

            background: #ffc107;

            box-shadow:
                0 0 10px rgba(255, 193, 7, 0.6);

            animation: loading 1.5s ease-in-out infinite;
        }

        @keyframes loading {
            0% {
                transform: translateX(-120%);
            }

            50% {
                transform: translateX(180%);
            }

            100% {
                transform: translateX(300%);
            }
        }

        /*
        |--------------------------------------------------------------------------
        | Footer
        |--------------------------------------------------------------------------
        */

        .footer {
            position: absolute;

            bottom: 20px;
            left: 0;
            right: 0;

            text-align: center;

            font-size: 0.65rem;

            letter-spacing: 0.08em;

            color: rgba(255, 255, 255, 0.30);
        }

        /*
        |--------------------------------------------------------------------------
        | Petit élément décoratif
        |--------------------------------------------------------------------------
        */

        .accent-line {
            width: 35px;
            height: 2px;

            margin: 14px auto 0;

            background: #ffc107;

            border-radius: 10px;

            box-shadow:
                0 0 8px rgba(255, 193, 7, 0.5);
        }
    </style>
</head>

<body>

    <div class="splash-container">

        <div class="text-center">

            <!-- Nom de l'application -->
            <div class="app-name">
                Proto X-24
            </div>

            <div class="accent-line"></div>

            <div class="app-subtitle">
                Gestion commerciale
            </div>


            <!-- Chargement -->
            <div class="loading-area mx-auto">

                <div class="d-flex align-items-center justify-content-center gap-2">

                    <div class="loading-spinner"></div>

                    <span class="loading-text">
                        Initialisation...
                    </span>

                </div>

                <div class="loading-bar">

                    <div class="loading-bar-progress"></div>

                </div>

            </div>

        </div>


        <!-- Footer -->
        <div class="footer">
            Proto X-24 · Solution de gestion commerciale
        </div>

    </div>

</body>

</html>
