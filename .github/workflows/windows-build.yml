name: Build Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite, fileinfo, mbstring, openssl, curl, zip, gd
          tools: composer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install PHP dependencies for Windows
        run: |
          Remove-Item -Force composer.lock -ErrorAction SilentlyContinue
          composer install --no-interaction --prefer-dist --optimize-autoloader --ignore-platform-reqs

      - name: Create .env file
        run: |
          Copy-Item .env.example .env -ErrorAction SilentlyContinue
          if (-not (Test-Path .env)) {
            @"
APP_NAME=Proto-X-24
APP_ENV=local
APP_KEY=
APP_DEBUG=true
APP_URL=http://localhost

LOG_CHANNEL=stack
LOG_LEVEL=debug

DB_CONNECTION=sqlite
DB_DATABASE=database/database.sqlite

BROADCAST_DRIVER=log
CACHE_DRIVER=file
QUEUE_CONNECTION=sync
SESSION_DRIVER=file
SESSION_LIFETIME=120

MEMCACHED_HOST=127.0.0.1

REDIS_HOST=127.0.0.1
REDIS_PASSWORD=null
REDIS_PORT=6379

MAIL_MAILER=smtp
MAIL_HOST=mailpit
MAIL_PORT=1025
MAIL_USERNAME=null
MAIL_PASSWORD=null
MAIL_ENCRYPTION=null
MAIL_FROM_ADDRESS="hello@example.com"
MAIL_FROM_NAME="${APP_NAME}"
"@ | Out-File -FilePath .env -Encoding UTF8
          }
          
          # Générer APP_KEY si nécessaire
          php artisan key:generate --no-interaction

      - name: Install Node dependencies
        run: npm install

      - name: Install NativePHP
        run: php artisan native:install

      - name: Build frontend
        run: npm run build

      - name: Build NativePHP Windows
        run: php artisan native:build win

      - name: Find Windows builds
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Include *.exe,*.msi |
            Select-Object FullName

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Proto-X-24-Windows
          path: |
            dist/**/*.exe
            dist/**/*.msi