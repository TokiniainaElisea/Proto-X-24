name: Build Windows

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: sqlite3, pdo_sqlite
          tools: composer

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install PHP dependencies for Windows
        run: |
          # Supprimer l'ancien lock file pour éviter les conflits de plateforme
          Remove-Item -Force composer.lock -ErrorAction SilentlyContinue
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Install Node dependencies
        run: npm install

      - name: Install NativePHP
        run: php artisan native:install

      - name: Build frontend
        run: npm run build

      - name: Build NativePHP Windows
        run: php artisan native:build win

      - name: Find Windows builds
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Include *.exe,*.msi |
            Select-Object FullName

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Proto-X-24-Windows
          path: |
            dist/**/*.exe
            dist/**/*.msi